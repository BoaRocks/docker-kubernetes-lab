apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-kubernetes-lab

spec:
  replicas: 2

  selector:
    matchLabels:
      app: docker-kubernetes-lab

  template:
    metadata:
      labels:
        app: docker-kubernetes-lab

    spec:
      containers:
        - name: web
          image: docker-kubernetes-lab:local
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"

            limits:
              cpu: "200m"
              memory: "128Mi"